name: wrkst workerd release

on:
  push:
    tags:
      - wrkst-workerd-v*
  workflow_dispatch:
    inputs:
      version:
        description: npm package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wrkst-workerd-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#wrkst-workerd-v}"
          fi
          test "$(npx --yes semver@7.7.2 "$VERSION")" = "$VERSION"
          case "$VERSION" in
            *-* | *+*) exit 1 ;;
          esac
          for PACKAGE_NAME in \
            @wrkst/workerd \
            @wrkst/workerd-linux-64 \
            @wrkst/workerd-darwin-arm64
          do
            CURRENT_VERSION=$(npm view "$PACKAGE_NAME@latest" version 2> /dev/null || true)
            if [ -n "$CURRENT_VERSION" ]; then
              npx --yes semver@7.7.2 "$VERSION" --range ">=$CURRENT_VERSION" > /dev/null
            fi
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=wrkst-workerd-v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            runner-arch: X64
            bazel-config: release_linux
          - name: macos-arm64
            runner: macos-15
            runner-arch: ARM64
            bazel-config: release_macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Report runner resources
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "cpu_count=$(nproc)"
            awk '/MemTotal/ { print "memory_kib=" $2 }' /proc/meminfo
          else
            echo "cpu_count=$(sysctl -n hw.ncpu)"
            echo "memory_bytes=$(sysctl -n hw.memsize)"
          fi

      - name: Cache Bazel data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/bazel-disk-cache
            ~/bazel-repository-cache
          key: wrkst-bazel-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'build/ci.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            wrkst-bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Build workerd
        shell: bash
        run: |
          mkdir -p "$HOME/bazel-disk-cache" "$HOME/bazel-repository-cache"
          bazel --batch build \
            --config=ci \
            --config=ci-limit-storage \
            --config=${{ matrix.bazel-config }} \
            --strip=always \
            --jobs=auto \
            --local_resources=cpu=HOST_CPUS \
            --local_resources="memory=HOST_RAM*.75" \
            --repository_cache="$HOME/bazel-repository-cache" \
            --disk_cache="$HOME/bazel-disk-cache" \
            //src/workerd/server:workerd

      - name: Verify binary
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.runner-arch }}"
          file bazel-bin/src/workerd/server/workerd
          bazel-bin/src/workerd/server/workerd --version

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wrkst-workerd-${{ matrix.name }}
          path: bazel-bin/src/workerd/server/workerd
          if-no-files-found: error
          retention-days: 7

      - name: Trim Bazel cache
        if: always()
        shell: bash
        run: |
          if [ -d "$HOME/bazel-disk-cache" ]; then
            find "$HOME/bazel-disk-cache" -type f -size +100M -delete
            du -sh "$HOME/bazel-disk-cache" "$HOME/bazel-repository-cache"
          fi

  publish:
    needs:
      - version
      - build
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      WORKERD_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wrkst-workerd-linux-x64
          path: /tmp/wrkst-workerd-linux-x64

      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wrkst-workerd-macos-arm64
          path: /tmp/wrkst-workerd-macos-arm64

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p /tmp/release /tmp/packages
          chmod +x /tmp/wrkst-workerd-linux-x64/workerd
          chmod +x /tmp/wrkst-workerd-macos-arm64/workerd
          gzip -9 -c /tmp/wrkst-workerd-linux-x64/workerd > /tmp/release/wrkst-workerd-linux-x64.gz
          gzip -9 -c /tmp/wrkst-workerd-macos-arm64/workerd > /tmp/release/wrkst-workerd-macos-arm64.gz
          cd /tmp/release
          sha256sum wrkst-workerd-*.gz > SHA256SUMS

      - name: Prepare npm packages
        shell: bash
        run: |
          cp -R npm/wrkst-workerd-linux-64 /tmp/packages/linux
          cp -R npm/wrkst-workerd-darwin-arm64 /tmp/packages/macos
          cp -R npm/wrkst-workerd /tmp/packages/wrapper
          mkdir -p /tmp/packages/linux/bin /tmp/packages/macos/bin
          cp /tmp/wrkst-workerd-linux-x64/workerd /tmp/packages/linux/bin/wrkst-workerd
          cp /tmp/wrkst-workerd-macos-arm64/workerd /tmp/packages/macos/bin/wrkst-workerd
          chmod +x /tmp/packages/linux/bin/wrkst-workerd
          chmod +x /tmp/packages/macos/bin/wrkst-workerd
          chmod +x /tmp/packages/wrapper/bin/wrkst-workerd
          node npm/scripts/bump-version.mjs /tmp/packages/linux/package.json
          node npm/scripts/bump-version.mjs /tmp/packages/macos/package.json
          node npm/scripts/build-wrkst-shim-package.mjs /tmp/packages/wrapper "$WORKERD_VERSION"

      - name: Inspect npm packages
        shell: bash
        run: |
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/linux
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/macos
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/wrapper

      - name: Prepare GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "$RELEASE_TAG^{commit}" > /dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if ! git rev-parse "$RELEASE_TAG^{commit}" > /dev/null 2>&1; then
              TARGET_COMMIT=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
              test "$TARGET_COMMIT" = "$GITHUB_SHA"
            fi
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" = "true" ]; then
              gh release upload "$RELEASE_TAG" /tmp/release/* --clobber
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$RELEASE_TAG" /tmp/release/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" /tmp/release/* --draft --target "$GITHUB_SHA" --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Publish npm packages
        shell: bash
        run: |
          publish_package() {
            PACKAGE_DIRECTORY="$1"
            PACKAGE_NAME=$(node -p "require('$PACKAGE_DIRECTORY/package.json').name")
            LOCAL_INTEGRITY=$(cd "$PACKAGE_DIRECTORY" && npm pack --dry-run --json | node -e 'let data = ""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data)[0].integrity));')
            REMOTE_INTEGRITY=$(npm view "$PACKAGE_NAME@$WORKERD_VERSION" dist.integrity 2> /dev/null || true)
            if [ -n "$REMOTE_INTEGRITY" ]; then
              test "$LOCAL_INTEGRITY" = "$REMOTE_INTEGRITY"
            else
              cd "$PACKAGE_DIRECTORY"
              npm publish --access public --tag latest
            fi
          }
          publish_package /tmp/packages/linux
          publish_package /tmp/packages/macos
          publish_package /tmp/packages/wrapper

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
