name: wrkst workerd build

on:
  push:
    branches:
      - wrkst-main
  pull_request:
    branches:
      - wrkst-main
  workflow_dispatch:

concurrency:
  group: wrkst-workerd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            runner-arch: X64
            bazel-config: ci-linux
          - name: macos-arm64
            runner: macos-15
            runner-arch: ARM64
            bazel-config: ci-macOS
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Report runner resources
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "cpu_count=$(nproc)"
            awk '/MemTotal/ { print "memory_kib=" $2 }' /proc/meminfo
          else
            echo "cpu_count=$(sysctl -n hw.ncpu)"
            echo "memory_bytes=$(sysctl -n hw.memsize)"
          fi

      - name: Cache Bazel data
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk-cache
            ~/bazel-repository-cache
          key: wrkst-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', '.bazelrc', 'build/ci.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Set up runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Build workerd
        shell: bash
        run: |
          mkdir -p "$HOME/bazel-disk-cache" "$HOME/bazel-repository-cache"
          bazel --batch build \
            --config=ci \
            --config=ci-limit-storage \
            --config=${{ matrix.bazel-config }} \
            --strip=always \
            --jobs=auto \
            --local_resources=cpu=HOST_CPUS \
            --local_resources="memory=HOST_RAM*.75" \
            --repository_cache="$HOME/bazel-repository-cache" \
            --disk_cache="$HOME/bazel-disk-cache" \
            //src/workerd/server:workerd

      - name: Verify binary
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "${{ matrix.runner-arch }}"
          file bazel-bin/src/workerd/server/workerd
          bazel-bin/src/workerd/server/workerd --version

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: wrkst-workerd-${{ matrix.name }}
          path: bazel-bin/src/workerd/server/workerd
          if-no-files-found: error
          retention-days: 7

      - name: Trim Bazel cache
        if: always()
        shell: bash
        run: |
          if [ -d "$HOME/bazel-disk-cache" ]; then
            find "$HOME/bazel-disk-cache" -type f -size +100M -delete
            du -sh "$HOME/bazel-disk-cache" "$HOME/bazel-repository-cache"
          fi

  package:
    needs: build
    runs-on: ubuntu-22.04
    env:
      WORKERD_VERSION: 0.0.0-ci.${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wrkst-workerd-linux-x64
          path: /tmp/wrkst-workerd-linux-x64

      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wrkst-workerd-macos-arm64
          path: /tmp/wrkst-workerd-macos-arm64

      - name: Prepare npm packages
        shell: bash
        run: |
          mkdir -p /tmp/packages/linux/bin /tmp/packages/macos/bin /tmp/tarballs
          cp -R npm/wrkst-workerd-linux-64/. /tmp/packages/linux
          cp -R npm/wrkst-workerd-darwin-arm64/. /tmp/packages/macos
          cp -R npm/wrkst-workerd /tmp/packages/wrapper
          cp /tmp/wrkst-workerd-linux-x64/workerd /tmp/packages/linux/bin/wrkst-workerd
          cp /tmp/wrkst-workerd-macos-arm64/workerd /tmp/packages/macos/bin/wrkst-workerd
          chmod +x /tmp/packages/linux/bin/wrkst-workerd
          chmod +x /tmp/packages/macos/bin/wrkst-workerd
          chmod +x /tmp/packages/wrapper/bin/wrkst-workerd
          node npm/scripts/bump-version.mjs /tmp/packages/linux/package.json
          node npm/scripts/bump-version.mjs /tmp/packages/macos/package.json
          node npm/scripts/build-wrkst-shim-package.mjs /tmp/packages/wrapper "$WORKERD_VERSION"
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/linux
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/macos
          node npm/scripts/check-wrkst-package.mjs /tmp/packages/wrapper
          npm pack /tmp/packages/linux --pack-destination /tmp/tarballs
          npm pack /tmp/packages/macos --pack-destination /tmp/tarballs
          npm pack /tmp/packages/wrapper --pack-destination /tmp/tarballs

      - name: Install npm packages
        shell: bash
        run: |
          mkdir /tmp/install
          cd /tmp/install
          npm init --yes > /dev/null
          npm install \
            "/tmp/tarballs/wrkst-workerd-linux-64-$WORKERD_VERSION.tgz" \
            "/tmp/tarballs/wrkst-workerd-$WORKERD_VERSION.tgz"
          file node_modules/@wrkst/workerd/bin/wrkst-workerd
          node_modules/.bin/wrkst-workerd --version
